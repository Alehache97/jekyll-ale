<head prefix="og: http://ogp.me/ns#">
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="{{ site.title }}" />
  <meta name="apple-mobile-web-app-status-bar-style" content="#fff" />
  <meta name="apple-mobile-web-app-title" content="{{ site.title }}" />
  <title>
    {% if page.title %}
      {{ page.title | escape }} | La Terminal de Macale
    {% else %}
      La Terminal de Macale
    {% endif %}
  </title>

  <link rel="alternate" href="{{ page.url | remove: 'index.html' | remove: '.html' | absolute_url }}" hreflang="{{ site.lang }}" />
  <link rel="canonical" href="{{ page.url | remove: 'index.html' | remove: '.html' | absolute_url }}" />
  {% if paginator.previous_page %}
    <link rel="prev" href="{{ paginator.previous_page_path | remove: 'index.html' | remove: '.html' }}" />
  {% endif %}
  {% if paginator.next_page %}
    <link rel="next" href="{{ paginator.next_page_path | remove: 'index.html' | remove: '.html' }}" />
  {% endif %}

  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 200 | escape }}" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <meta property="fb:app_id" content="{{ site.fb_appid }}" />

  <!-- Open Graph / Facebook -->
  <meta property="og:site_name" content="{% if page.title %}{{ page.title | escape }} | {{ site.author.name }}{% else %}{{ site.title | escape }}{% endif %}" />
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {{ site.author.name }}{% else %}{{ site.title | escape }}{% endif %}" />
  <meta property="og:type" content="{% if page.location %}article{% else %}website{% endif %}" />
  {% if page.location %}
    <meta property="article:publisher" content="https://web.facebook.com/{{ site.author.facebook }}" />
  {% endif %}
  <meta property="og:url" content="{{ page.url | remove: 'index.html' | remove: '.html' | absolute_url }}" />
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 200 | escape }}" />
  <meta property="og:image" content="{{ page.image | default: site.image | absolute_url }}" />
  <meta property="og:image:width" content="640" />
  <meta property="og:image:height" content="640" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }} | {{ site.author.twitter }}{% else %}{{ site.title | escape }}{% endif %}" />
  <meta name="twitter:url" content="{{ page.url | remove: 'index.html' | remove: '.html' | absolute_url }}" />
  <meta name="twitter:site" content="@{{ site.author.twitter }}" />
  <meta name="twitter:creator" content="@{{ site.author.twitter }}" />
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 200 | escape }}" />
  <meta name="twitter:image" content="{{ page.image | default: site.image | absolute_url }}" />

  {% feed_meta %}

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicons/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicons/android-chrome-512x512.png">
  <link rel="shortcut icon" href="/assets/favicons/favicon.ico">
  <link rel="manifest" href="/assets/favicons/site.webmanifest">
  <meta name="theme-color" content="#2c2c2c" />

  <link rel="stylesheet" href="/assets/css/style.css" />

  <!-- for mathjax support -->
  {% if page.usemathjax %}
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "AMS" } } });
    </script>
    <script type="text/javascript" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js?config=TeX-AMS-MML_HTMLorMML"></script>
  {% endif %}
</head>
